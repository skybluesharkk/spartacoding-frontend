name: skybluesharkk-ci     

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20      
          cache: yarn         

      
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      
      - name: Run unit tests
        run: yarn vitest --run
